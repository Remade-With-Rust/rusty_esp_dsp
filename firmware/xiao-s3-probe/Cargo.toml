# The I5 ceiling probe on real silicon: run the scalar kernels on an
# ESP32-S3 and report per-unit cost with the work counts beside it, so the
# share table the twins are ranked by is the chip's rather than a laptop's.
# Also reports what the chip says about its own memory, and dumps a megabyte
# from its random number generator for an outside statistic to judge.
#
# Track B (esp-hal, no ESP-IDF), Seeed XIAO ESP32-S3 Sense. A separate cargo
# project: Xtensa target, the esp toolchain, build-std.

[package]
name = "xiao-s3-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "xiao-s3-probe"
harness = false

[dependencies]
esp-hal = { version = "=1.2.0", features = ["esp32s3"] }
# One arm each, and never both: see [features]. `optional` matters --
# esp-alloc claims `#[global_allocator]` under its own default feature, so
# it cannot merely be present while the other arm is selected.
esp-alloc = { version = "=0.11.0", features = ["esp32s3"], optional = true }
rusty_esp_alloc = { git = "https://github.com/Remade-With-Rust/rusty_esp_core", default-features = false, optional = true }
esp-bootloader-esp-idf = { version = "=0.6.0", features = ["esp32s3"] }
esp-println = { version = "=0.18.0", features = ["esp32s3"] }
esp-backtrace = { version = "=0.20.0", features = ["esp32s3", "panic-handler", "println"] }
# The kernels and the measurement discipline, no_std: the same code the host
# share table measured, so the two are comparable per unit.
rusty_esp_dsp = { path = "../../crates/rusty_esp_dsp", default-features = false }
# The PIE twins, so a SIMD kernel can be measured beside the scalar one it
# replaces in ONE binary.
rusty_esp_dsp-esp = { path = "../../crates/rusty_esp_dsp-esp", default-features = false, features = ["pie-s3"] }
# The audio element kernels (gain, channels, DC block, biquad, resampler).
# Audited for ALLOCATION earlier and found clean; never for instruction count,
# which is a different question. Measured here so they get a null arm too.
rusty_esp_audio-core = { path = "../../../rusty_esp_audio/crates/rusty_esp_audio-core", default-features = false, features = ["alloc", "pie-s3"] }
# The CSI presence kernels: `features` runs per radio frame at 20-50 Hz and
# `push` folds a 50-frame window, so both are real per-frame work.
rusty_esp_signal-core = { path = "../../../rusty_esp_signal/crates/rusty_esp_signal-core", default-features = false, features = ["alloc"] }
# The three pixel kernels the DSP crate did NOT take: crop, rotate90, rotate180.
rusty_esp_image-core = { path = "../../../rusty_esp_image/crates/rusty_esp_image-core", default-features = false, features = ["alloc", "pie-s3"] }

[features]
# The allocator arm. Exactly one, and the default is esp-hal's standard so
# nothing changes for anyone who does not ask.
#
#   cargo build --release                                        # esp-alloc
#   cargo build --release --no-default-features --features alloc-rusty,...
#
# ONE BINARY SOURCE: both arms are this firmware with one line different, so a
# comparison between them is like for like rather than two programs.
default = ["alloc-esp"]
alloc-esp = ["dep:esp-alloc"]
alloc-rusty = ["dep:rusty_esp_alloc"]
# The megabyte dump for an entropy statistic; off by default because it costs
# 48 s and 16,384 lines and the kernel numbers do not need it.
rngdump = []

[profile.release]
# 3, not "s": the host share table this is compared against was built for
# speed, and a size-optimised arm against a speed-optimised arm is not a
# comparison. (Measured both ways on 2026-09-06; see the ledger.)
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = "z"
panic = "abort"

[workspace]

# audio-core takes rusty_esp_dsp from git; the probe takes it by path. Without
# this the graph carries TWO copies and the kernels measured are not the ones
# being edited -- the reachability trap, as a build-graph bug.
[patch."https://github.com/Remade-With-Rust/rusty_esp_dsp"]
rusty_esp_dsp = { path = "../../crates/rusty_esp_dsp" }
# BOTH halves. The chip half was missing here and the failure was exactly the
# one the comment above predicts: audio-core resolved `rusty_esp_dsp-esp` to
# the PUBLISHED crate, which has no `pie_s3` module because nothing is pushed
# -- so the A1 wiring would not compile, and had it compiled against a
# published copy that merely lacked the twins it would have measured the
# oracle while looking wired. Patch every crate of a sibling, not the one you
# happened to need first.
rusty_esp_dsp-esp = { path = "../../crates/rusty_esp_dsp-esp" }
