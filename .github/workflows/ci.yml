name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Sibling Janus repos are consumed by git URL and are PRIVATE until each is
  # market-ready. Cargo fetches them through the git CLI, which honours the
  # token rewrite below. Set the repository secret JANUS_GIT_TOKEN to a
  # fine-grained PAT (or GitHub App token) with read access to the siblings.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  JANUS_GIT_TOKEN: ${{ secrets.JANUS_GIT_TOKEN }}

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      # Licences, the no-C ban list, advisories and the git allow-list: the
      # posture deny.toml states, checked on every push rather than by hand.
      - run: cargo deny check

  no_std:
    name: no_std (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imac-unknown-none-elf   # ESP32-C6 / C61 / H2 class
          - riscv32imafc-unknown-none-elf  # ESP32-P4 class
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check -p rusty_esp_dsp --no-default-features --target ${{ matrix.target }}
      - run: cargo check -p rusty_esp_dsp --no-default-features --features alloc --target ${{ matrix.target }}
      # The chip half: the P4's twins on the P4-class target; the S3's twins
      # need the esp toolchain (xtensa-esp32s3-none-elf, build-std) and are
      # checked locally, ledger row D2.
      - run: cargo check -p rusty_esp_dsp-esp --no-default-features --features pie-p4 --target ${{ matrix.target }}

  # ---------------------------------------------------------------------
  # The firmware actually builds.
  #
  # This job exists because "nothing builds this" is a state that persists
  # SILENTLY. On 2026-09-21 two firmwares in this family were found to have
  # been uncompilable for long enough that a security decision -- moving the
  # device key out of the owner's NVS partition, taken 2026-09-05 -- never
  # reached them, and a struct they initialise had gained two fields. Nobody
  # was careless; there was simply no signal, because a compile error only
  # helps if something compiles.
  #
  # Xtensa bare metal: espup's toolchain and NO ESP-IDF. These are esp-hal
  # firmwares, so the slow half of an ESP build never happens and this is
  # cheap enough to run on every push. The ESP-IDF firmwares in this family
  # are minutes each and belong on a schedule instead.
  firmware:
    name: firmware (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - xiao-s3-probe
    steps:
      - uses: actions/checkout@v4
      - name: Authorise private sibling fetches
        if: ${{ env.JANUS_GIT_TOKEN != '' }}
        shell: bash
        run: git config --global url."https://x-access-token:${JANUS_GIT_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32s3
          # ldproxy links an ESP-IDF app. These are bare metal and do not
          # need it; installing it would only cost time.
          ldproxy: false
      # `build-std = ["core", "alloc"]` in the firmware's .cargo/config.toml
      # needs rust-src, which the action above installs.
      - run: cargo build --release
        working-directory: firmware/${{ matrix.project }}
