[package]
name = "rusty_esp_dsp"
description = "ESP-DSP remade for the Janus family: the scalar kernel home (pixel conversions and downscales, PCM reductions and sample-format conversion, the H.264 block costs, the work counters and ceiling probe) where every kernel is the oracle for a PIE twin. no_std, forbid(unsafe), no allocator, no drivers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/rusty_esp_dsp"
keywords = ["esp32", "embedded", "no-std", "dsp", "simd"]
categories = ["embedded", "no-std", "multimedia", "hardware-support"]

[features]
default = ["std"]
# The feature ladder is the rusty_zstd one: `std` implies `alloc`; with neither,
# the crate is pure `core` and still builds on riscv32 bare metal. Nothing in
# this crate needs `alloc` today; the rungs exist so consumers compose.
std = ["alloc", "rusty_esp_core/std"]
alloc = ["rusty_esp_core/alloc"]

[dependencies]
rusty_esp_core = { workspace = true }
# Pure-Rust libm for the two transcendentals in the dBFS reduction. The same
# arithmetic on the host and on a chip, so a level reads the same everywhere.
libm = { version = "0.2", default-features = false }

[dev-dependencies]
# The oracle for the H.264 block kernels: `rusty_h264-common` is where the
# encoder's own scalar transform lives. Default features OFF (no allocator
# hijack, no x86 asm) plus `std` for the host test run. Same branch as
# rusty_esp_video's encoder dependency.
rusty_h264-common = { version = "0.14", default-features = false, features = ["std"] }

[lints]
workspace = true
